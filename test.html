<!DOCTYPE HTML>
<html>
    <head>
        <title>Homepage</title>
        <link rel="stylesheet" type="text/css" href="test.css">
        <link rel="stylesheet" type="text/css" href="font\weather-icons.min.css">
        <link rel="stylesheet" type="text/css" href="font\weather-icons-wind.min.css">
        <link rel="stylesheet" type="font" href="font\weathericons-regular-webfont.ttf">
        
    </head>
    <body>
        <script src = "weather.js"></script>
        <div id="main">
            <div id="weather">
                <div id="internal">
                    <div id="icon"></div>
                    <div id="contents">
                        <div id="current">
                            <div id="name"></div>
                            <div id="coords"></div>
                            <div id="temp"></div>
                        </div>
                        <div id="misc">
                            <div id="pressureLabel">Pressure: </div><div id="pressure"></div>
                            <div id="humidLabel">Humidity: </div><div id="humid"></div>
                            <div id="windLabel">Wind: </div><div id="wind"></div>
                            <div id="windIcon"></div>
                        </div>
                    </div>
                    <div id="time"></div>
                </div>
                <div id="future">
                    <div id="day1" class="days">
                        <div id="day1Icon" class="dayIcons"></div>
                        <div id="day1High" class="dayHighs"></div>
                        <div id="day1Low" class="dayLows"></div>
                        <div id="day1Date" class="dayDates"></div>
                    </div>
                    <div id="day2" class="daysInt">
                        <div id="day2Icon" class="dayIcons"></div>
                        <div id="day2High" class="dayHighs"></div>
                        <div id="day2Low" class="dayLows"></div>
                        <div id="day2Date" class="dayDates"></div>
                    </div>
                    <div id="day3" class="daysInt">
                        <div id="day3Icon" class="dayIcons"></div>
                        <div id="day3High" class="dayHighs"></div>
                        <div id="day3Low" class="dayLows"></div>
                        <div id="day3Date" class="dayDates"></div>
                    </div>
                    <div id="day4" class="daysInt">
                        <div id="day4Icon" class="dayIcons"></div>
                        <div id="day4High" class="dayHighs"></div>
                        <div id="day4Low" class="dayLows"></div>
                        <div id="day4Date" class="dayDates"></div>
                    </div>
                    <div id="day5" class="days">
                        <div id="day5Icon" class="dayIcons"></div>
                        <div id="day5High" class="dayHighs"></div>
                        <div id="day5Low" class="dayLows"></div>
                        <div id="day5Date" class="dayDates"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
