<!doctype html>
<html lang="en">
    <head>
        <title>Homepage</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" href="styles/bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="font/weather-icons.min.css">
        <link rel="stylesheet" type="text/css" href="font/weather-icons-wind.min.css">
        <link rel="stylesheet" type="font" href="font/weathericons-regular-webfont.ttf">
        <script src="scripts/weather.js"></script>
        <script src="scripts/ether.js"></script>
    </head>
    <body style="background-image: url('background.jpeg'); color: #ffffff;">
        <div class="container" id="top-level">
            <div class="container">
                <div class="row">
                    <div class="col-sm-2 text-center" id="icon" style="font-size: 100px"></div>
                    <div class="col-sm-7">
                        <div class="row">
                            <div class="col-xs text-left d-flex flex-column justify-content-center">
                                <div id="name" style="font-size: 28px; font-weight: bold;
                                                      line-height: 28px;"></div>
                                <div id="coords" style="font-size: 12px; line-height: 12px;"></div>
                                <div id="temp" style="font-size: 64px; line-height: 64px;"></div>
                            </div>
                            <div class="col-4">
                                <div class="row">
                                    <div class="col-xs">
                                        <div class="text-left" id="precipLabel">Precipitation: </div>
                                    </div>
                                    <div class="col-xs">
                                        <div class="text-right" id="precip"></div>
                                    </div>
                                    <div class="w-100"></div>
                                    <div class="col-xs">
                                        <div class="text-left" id="pressureLabel">Pressure: </div>
                                    </div>
                                    <div class="col-xs">
                                        <div class="text-right" id="pressure"></div>
                                    </div>
                                    <div class="w-100"></div>
                                    <div class="col-xs">
                                        <div class="text-left" id="humidLabel">Humidity: </div>
                                    </div>
                                    <div class="col-xs">
                                        <div class="text-right" id="humid"></div>
                                    </div>
                                    <div class="w-100"></div>
                                    <div class="col-xs">
                                        <div class="text-left" id="windLabel">Wind: </div>
                                    </div>
                                    <div class="col-xs">
                                        <div class="text-right" id="wind"></div>
                                    </div>
                                    <div class="w-100"></div>
                                    <div class="col-xs"></div>
                                    <div class="col-xs">
                                        <div class="text-left" id="windIcon"></div>
                                    </div>
                            </div>
                            <div class="w-100"></div>
                            <div id="time"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="day1Icon"></div>
        <div id="day1High"></div>
        <div id="day1Low"></div>
        <div id="day1Date"></div>
        <div id="day2Icon"></div>
        <div id="day2High"></div>
        <div id="day2Low"></div>
        <div id="day2Date"></div>
        <div id="day3Icon"></div>
        <div id="day3High"></div>
        <div id="day3Low"></div>
        <div id="day3Date"></div>
        <div id="day4Icon"></div>
        <div id="day4High"></div>
        <div id="day4Low"></div>
        <div id="day4Date"></div>
        <div id="day5Icon"></div>
        <div id="day5High"></div>
        <div id="day5Low"></div>
        <div id="day5Date"></div>
        <div id="etherLabel">ETH: </div>
        <div id="price"></div>
        <div id="priceHighLabel">High: </div><div id="priceHigh"></div>
        <div id="priceLowLabel">Low: </div><div id="priceLow"></div>

        <script src="libs/jquery-3.3.1.js"></script>
        <script src="libs/popper.min.js"></script>
        <script src="libs/bootstrap.min.js"></script>
    </body>
</html>
