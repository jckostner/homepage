<!doctype html>
<html lang="en">
    <head>
        <title>Homepage</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" href="styles/bootstrap.css">
        <link rel="stylesheet" type="text/css" href="font/weather-icons.min.css">
        <link rel="stylesheet" type="text/css" href="font/weather-icons-wind.min.css">
        <link rel="stylesheet" type="text/css" href="styles/styles.css">
        <link rel="stylesheet" type="font" href="font/weathericons-regular-webfont.ttf">
        <script src="scripts/weather.js"></script>
        <script src="scripts/ether.js"></script>
        <script src="scripts/bookmarks.js></script>
        <script src="data/bookmarks.json></script>
    </head>
    <body>
        <div class="container-fluid" id="top-level">
            <div class="row">
                <div class="col-12 col-md-6 col-xxl-4 widget-ext" id="ether-widget">
                    <div class="container widget-int">
                        <div class="row" id="eth-top">
                            <div class="col d-flex justify-content-center">
                                <div class="widget-title" id="etherLabel">ETHEREUM:</div>
                            </div>
                        </div>
                        <div class="row" id="eth-mid">
                            <div class="col d-flex justify-content-center">
                                <div class="widget-main" id="price"></div>
                            </div>
                        </div>
                        <div class="row" id="eth-bot">
                            <div class="col-6 d-flex flex-column justify-content-center 
                                align-items-center day-left" id="eth-bot-left">
                                <div class="widget-title" id="priceHighLabel">High: </div>
                                <div class="widget-sub" id="priceHigh"></div>
                            </div>
                            <div class="col-6 d-flex flex-column justify-content-center 
                                align-items-center day-right" id="eth-bot-right">
                                <div class="widget-title" id="priceLowLabel">Low: </div>
                                <div class="widget-sub" id="priceLow"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-xxl-4 align-self-start widget-ext" 
                    id="weather-widget">
                    <div class="container widget-int">
                        <div class="row justify-content-between" id="current-weather">
                            <div class="col-auto d-flex flex-column justify-content-center" 
                                id="cur-left-col">
                                <div class="widget-main" id="cur-icon"></div>
                            </div>
                            <div class="col-auto d-flex flex-column justify-content-center" 
                                id="cur-center-col">
                                <div class="widget-title" id="city-name"></div>
                                <div class="cur-day-info-min" id="city-coords"></div>
                                <div class="widget-sub" id="cur-temp"></div>
                            </div>
                            <div class="col-auto d-flex flex-column justify-content-center" 
                                id="cur-right-col">
                                <div class="row" id="cur-day-info">
                                    <div class="col-6-auto">
                                        <div class="text-left cur-day-info" 
                                            id="cur-precip-label">Precipitation:&nbsp;&nbsp;&nbsp;
                                        </div>
                                        <div class="text-left cur-day-info" 
                                            id="cur-pressure-label">Pressure: </div>
                                        <div class="text-left cur-day-info" 
                                            id="cur-humid-label">Humidity: </div>
                                        <div class="text-left cur-day-info" 
                                            id="cur-wind-label">Wind: </div>
                                    </div>
                                    <div class="col-6-auto">
                                        <div class="text-right cur-day-info" id="cur-precip"></div>
                                        <div class="text-right cur-day-info" id="cur-pressure">
                                        </div>
                                        <div class="text-right cur-day-info" id="cur-humid"></div>
                                        <div class="text-right cur-day-info" id="cur-wind"></div>
                                        <div class="text-right" id="cur-wind-icon"></div>
                                    </div>
                                </div>
                                <div class="row text-right">
                                    <div class="col-12">
                                        <div class="text-right cur-day-info-min" id="update-time">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row justify-content-between" id="daily-weather">
                            <div class="col day-left" id="day-1">
                                <div class="row d-flex justify-content-between">
                                    <div class="col-6-auto" id="day-1-left-col">
                                        <div class="day-icon" id="day-1-icon"></div>
                                    </div>
                                    <div class="col-6-auto d-flex flex-column justify-content-center 
                                        align-items-end" id="day-1-right-col">
                                        <div class="day-temp high" id="day-1-high"></div>
                                        <div class="day-temp low" id="day-1-low"></div>
                                    </div>
                                </div>
                                <div class="row d-flex justify-content-center">
                                    <div class="daily-date" id="day-1-date"></div>
                                </div>
                            </div>
                            <div class="col day-int" id="day-2">
                                <div class="row d-flex justify-content-between">
                                    <div class="col-6-auto" id="day-2-left-col">
                                        <div class="day-icon" id="day-2-icon"></div>
                                    </div>
                                    <div class="col-6-auto d-flex flex-column justify-content-center
                                        align-items-end" id="day-2-right-col">
                                        <div class="day-temp high" id="day-2-high"></div>
                                        <div class="day-temp low" id="day-2-low"></div>
                                    </div>
                                </div>
                                <div class="row d-flex justify-content-center">
                                    <div class="daily-date" id="day-2-date"></div>
                                </div>
                            </div>
                            <div class="col day-int" id="day-3">
                                <div class="row d-flex justify-content-between">
                                    <div class="col-6-auto" id="day-3-left-col">
                                        <div class="day-icon" id="day-3-icon"></div>
                                    </div>
                                    <div class="col-6-auto d-flex flex-column justify-content-center
                                        align-items-end" id="day-3-right-col">
                                        <div class="day-temp high" id="day-3-high"></div>
                                        <div class="day-temp low" id="day-3-low"></div>
                                    </div>
                                </div>
                                <div class="row d-flex justify-content-center">
                                    <div class="daily-date" id="day-3-date"></div>
                                </div>
                            </div>
                            <div class="col day-int" id="day-4">
                                <div class="row d-flex justify-content-between">
                                    <div class="col-6-auto" id="day-4-left-col">
                                        <div class="day-icon" id="day-4-icon"></div>
                                    </div>
                                    <div class="col-6-auto d-flex flex-column justify-content-center
                                        align-items-end" id="day-4-right-col">
                                        <div class="day-temp high" id="day-4-high"></div>
                                        <div class="day-temp low" id="day-4-low"></div>
                                    </div>
                                </div>
                                <div class="row d-flex justify-content-center">
                                    <div class="daily-date" id="day-4-date"></div>
                                </div>
                            </div>
                            <div class="col day-right" id="day-5">
                                <div class="row d-flex justify-content-between">
                                    <div class="col-6-auto" id="day-5-left-col">
                                        <div class="day-icon" id="day-5-icon"></div>
                                    </div>
                                    <div class="col-6-auto d-flex flex-column justify-content-center
                                        align-items-end" id="day-5-right-col">
                                        <div class="day-temp high" id="day-5-high"></div>
                                        <div class="day-temp low" id="day-5-low"></div>
                                    </div>
                                </div>
                                <div class="row d-flex justify-content-center">
                                    <div class="daily-date" id="day-5-date"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-xxl-4 widget-ext">
                    <div class="container widget-int">
                    </div>
                </div>
                <div class="col-12 col-xxl-8 widget-ext" id="bookmarks-widget">
                    <div class="container widget-int">
                    </div>
                </div>
            </div>
        </div>

        <script src="libs/jquery-3.3.1.js"></script>
        <script src="libs/popper.min.js"></script>
        <script src="libs/bootstrap.min.js"></script>
    </body>
</html>
