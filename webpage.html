<!doctype html>
<html lang="en">
    <head>
        <title>Homepage</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" href="styles/bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="font/weather-icons.min.css">
        <link rel="stylesheet" type="text/css" href="font/weather-icons-wind.min.css">
        <link rel="stylesheet" type="text/css" href="styles/styles.css">
        <link rel="stylesheet" type="font" href="font/weathericons-regular-webfont.ttf">
        <script src="scripts/weather.js"></script>
        <script src="scripts/ether.js"></script>
    </head>
    <body>
        <div class="container" id="top-level">
            <div class="container" id="weather-widget">
                <div class="row" id="current-weather">
                    <div class="col" id="cur-left-col">
                        <div id="cur-icon"></div>
                    </div>
                    <div class="col" id="cur-center-col">
                        <div id="city-name"></div>
                        <div id="city-coords"></div>
                        <div id="cur-temp"></div>
                    </div>
                    <div class="col" id="cur-right-col">
                        <div class="text-left" id="cur-precip-label">Precipitation: </div>
                        <div class="text-left" id="cur-pressure-label">Pressure: </div>
                        <div class="text-left" id="cur-humid-label">Humidity: </div>
                        <div class="text-left" id="cur-wind-label">Wind: </div>
                        <div class="text-right" id="cur-precip"></div>
                        <div class="text-right" id="cur-pressure"></div>
                        <div class="text-right" id="cur-humid"></div>
                        <div class="text-right" id="cur-wind"></div>
                        <div class="text-right" id="cur-wind-icon"></div>
                        <div class="text-right" id="update-time"></div>
                    </div>
                </div>
                <div class="row" id="daily-weather">
                    <div class="col" id="day-1">
                        <div class="row d-flex justify-content-between">
                            <div class="col-xs" id="day-1-left-col">
                                <div class="day-icon" id="day-1-icon"></div>
                            </div>
                            <div class="col-xs d-flex flex-column justify-content-center" id="day-1-right-col">
                                <div class="day-temp high" id="day-1-high"></div>
                                <div class="day-temp low" id="day-1-low"></div>
                            </div>
                        </div>
                        <div class="row d-flex justify-content-center">
                            <div id="day-1-date"></div>
                        </div>
                    </div>
                    <div class="col" id="day-2">
                        <div class="row d-flex justify-content-between">
                            <div class="col-xs" id="day-2-left-col">
                                <div class="day-icon" id="day-2-icon"></div>
                            </div>
                            <div class="col-xs d-flex flex-column justify-content-center" id="day-2-right-col">
                                <div class="day-temp high" id="day-2-high"></div>
                                <div class="day-temp low" id="day-2-low"></div>
                            </div>
                        </div>
                        <div class="row d-flex justify-content-center">
                            <div id="day-2-date"></div>
                        </div>
                    </div>
                    <div class="col" id="day-3">
                        <div class="row d-flex justify-content-between">
                            <div class="col-xs d-flex justify-content-center" id="day-3-left-col">
                                <div class="day-icon" id="day-3-icon"></div>
                            </div>
                            <div class="col-xs d-flex flex-column justify-content-center" id="day-3-right-col">
                                <div class="day-temp high" id="day-3-high"></div>
                                <div class="day-temp low" id="day-3-low"></div>
                            </div>
                        </div>
                        <div class="row d-flex justify-content-center">
                            <div id="day-3-date"></div>
                        </div>
                    </div>
                    <div class="col" id="day-4">
                        <div class="row d-flex justify-content-between">
                            <div class="col-xs" id="day-4-left-col">
                                <div class="day-icon" id="day-4-icon"></div>
                            </div>
                            <div class="col-xs d-flex flex-column justify-content-center" id="day-4-right-col">
                                <div class="day-temp high" id="day-4-high"></div>
                                <div class="day-temp low" id="day-4-low"></div>
                            </div>
                        </div>
                        <div class="row d-flex justify-content-center">
                            <div id="day-4-date"></div>
                        </div>
                    </div>
                    <div class="col" id="day-5">
                        <div class="row d-flex justify-content-between">
                            <div class="col-xs" id="day-5-left-col">
                                <div class="day-icon" id="day-5-icon"></div>
                            </div>
                            <div class="col-xs d-flex flex-column justify-content-center" id="day-5-right-col">
                                <div class="day-temp high" id="day-5-high"></div>
                                <div class="day-temp low" id="day-5-low"></div>
                            </div>
                        </div>
                        <div class="row d-flex justify-content-center">
                            <div id="day-5-date"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="etherLabel">ETH: </div>
        <div id="price"></div>
        <div id="priceHighLabel">High: </div><div id="priceHigh"></div>
        <div id="priceLowLabel">Low: </div><div id="priceLow"></div>

        <script src="libs/jquery-3.3.1.js"></script>
        <script src="libs/popper.min.js"></script>
        <script src="libs/bootstrap.min.js"></script>
    </body>
</html>
